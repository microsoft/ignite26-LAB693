<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Same query, different retrieval strategies</title>
  <desc id="desc">Exact kNN calculates cosine distance across all stored vectors and sorts the results. Approximate DiskANN search uses a vector index to retrieve promising neighbors and can return a different top set. The drawing is conceptual, not real embedding coordinates or a measured graph. Inspect the actual plan for Vector Index Seek.</desc>
  <defs>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172b4d}.heading{font-size:27px;font-weight:700}.label{font-size:21px;font-weight:600}.detail{font-size:16px;fill:#465974}.point{fill:#8a9cb5}.selected{fill:#0e7070;stroke:#ffffff;stroke-width:2}</style>
  </defs>
  <rect width="960" height="470" rx="16" fill="#f5f7fb"/>
  <text x="32" y="44" class="heading">Same query, different retrieval strategies</text>
  <text x="32" y="76" class="detail">Cosine distance sorts ascending: smaller means closer, not more certain.</text>
  <rect x="32" y="101" width="432" height="279" rx="12" fill="#ffffff" stroke="#c3cedd"/>
  <rect x="496" y="101" width="432" height="279" rx="12" fill="#ffffff" stroke="#c3cedd"/>
  <text x="52" y="135" class="label">Exact kNN</text>
  <text x="516" y="135" class="label">Approximate DiskANN</text>
  <text x="52" y="163" class="detail">Compute every distance, then sort</text>
  <text x="516" y="163" class="detail">Use the index to find candidate neighbors</text>
  <g stroke="#d8e1ee" stroke-width="1.5">
    <path d="M175 249L81 197M175 249L133 207M175 249L225 194M175 249L317 207M175 249L402 223M175 249L94 268M175 249L145 285M175 249L248 250M175 249L327 274M175 249L409 291M175 249L92 326M175 249L216 316M175 249L282 322M175 249L363 328"/>
  </g>
