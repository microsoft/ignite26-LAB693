    <circle cx="317" cy="207" r="7"/><circle cx="402" cy="223" r="7"/><circle cx="94" cy="268" r="7"/>
    <circle cx="145" cy="285" r="7"/><circle cx="248" cy="250" r="7"/><circle cx="327" cy="274" r="7"/>
    <circle cx="409" cy="291" r="7"/><circle cx="92" cy="326" r="7"/><circle cx="216" cy="316" r="7"/>
    <circle cx="282" cy="322" r="7"/><circle cx="363" cy="328" r="7"/>
    <circle cx="545" cy="197" r="7"/><circle cx="597" cy="207" r="7"/><circle cx="689" cy="194" r="7"/>
    <circle cx="781" cy="207" r="7"/><circle cx="866" cy="223" r="7"/><circle cx="558" cy="268" r="7"/>
    <circle cx="609" cy="285" r="7"/><circle cx="712" cy="250" r="7"/><circle cx="791" cy="274" r="7"/>
    <circle cx="873" cy="291" r="7"/><circle cx="556" cy="326" r="7"/><circle cx="680" cy="316" r="7"/>
    <circle cx="746" cy="322" r="7"/><circle cx="827" cy="328" r="7"/>
  </g>
  <ellipse cx="639" cy="250" rx="85" ry="67" fill="#e7f5f2" fill-opacity=".55" stroke="#0e7070" stroke-dasharray="5 4"/>
  <path d="M827 328L791 274L712 250L639 249L609 285M639 249L597 207" fill="none" stroke="#0e7070" stroke-width="3"/>
  <circle cx="597" cy="207" r="8" class="selected"/>
  <circle cx="609" cy="285" r="8" class="selected"/>
  <circle cx="712" cy="250" r="8" class="selected"/>
