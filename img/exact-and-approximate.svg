  <text x="52" y="365" class="detail">VECTOR_DISTANCE + TOP</text>
  <text x="516" y="365" class="detail">VECTOR_SEARCH + TOP WITH APPROXIMATE</text>
  <text x="32" y="411" class="detail">Diamond = query. Dots = stored vectors. Paths and positions are illustrative, not actual index internals.</text>
  <text x="32" y="441" class="detail">Index existence is not index usage. Verify Vector Index Seek in the actual search plan.</text>
</svg>
